<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SPS-Werkbank – KOP, FUP, SCL &amp; AWL</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#e9edf1;--pane:#fff;--line:#d3dae2;--ink:#18222d;--mute:#5d6b79;--acc:#1f5fbf;--acc2:#e8f0fc;--top:#1c2731;--top2:#26333f;--on:#14a34a;--onbg:#dff5e7;--off:#3f72c9;--err:#d23b2f;--warn:#c98400;--mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;--lh:20px;--fs:13px}
*{box-sizing:border-box}html,body{margin:0;height:100%}
body{font:14px/1.4 'IBM Plex Sans',system-ui,sans-serif;color:var(--ink);background:var(--bg);display:flex;flex-direction:column;overflow:hidden}
button{font:inherit;cursor:pointer;border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:6px;padding:5px 10px}
button:hover{border-color:#a9b6c3}button.pri{background:var(--acc);border-color:var(--acc);color:#fff}button.danger{color:var(--err)}button:disabled{opacity:.45;cursor:not-allowed}
input,select,textarea{font:inherit;color:inherit}
.mono{font-family:var(--mono)}
/* Kopf */
#top{background:var(--top);color:#e8eef4;display:flex;align-items:center;gap:10px;padding:6px 12px;flex-wrap:wrap;border-bottom:3px solid #f0a020;position:relative;z-index:40}
.logo{width:20px;height:20px;border-radius:4px;background:linear-gradient(135deg,#f0a020 0 50%,#4b8fe8 50%);display:inline-block;flex-shrink:0}.logo.big{width:44px;height:44px;border-radius:9px}
.logo-btn{display:flex;align-items:center;gap:8px;background:transparent;border:1px solid transparent;color:#fff;font-weight:700;padding:5px 9px;border-radius:7px}
.logo-btn:hover,.logo-btn.act{background:var(--top2);border-color:#3a4957}.logo-btn .car{font-size:11px;opacity:.7}
.pinfo{display:flex;flex-direction:column;line-height:1.15;min-width:0}.pinfo b{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:220px}.pinfo small{color:#9fb0c0;font-size:11px;white-space:nowrap}
#top .tb{display:flex;gap:4px;flex-wrap:wrap}
#top .tb button{background:var(--top2);border-color:#3a4957;color:#e8eef4;display:flex;gap:6px;align-items:center}
#top .tb button:hover{background:#31414f}
#top .tb .run.act{background:#155f33;border-color:#1f8a4a}#top .tb .stop.act{background:#6b3d06;border-color:#a8650c}#top .tb .mon.act{background:#1d4580;border-color:#3069c1}
#top .tb .libbtn{display:none}
#top .i{font-size:13px}
#top .navt{display:none;background:none;border:0;color:#fff;font-size:20px;padding:2px 6px}
.cpu{margin-left:auto;display:flex;align-items:center;gap:8px;font-size:12.5px;background:var(--top2);padding:4px 10px;border-radius:20px;white-space:nowrap}
.cpu .led{width:10px;height:10px;border-radius:50%;background:#f0a020;box-shadow:0 0 6px #f0a020}.cpu.RUN .led{background:#2ad16a;box-shadow:0 0 8px #2ad16a}
.cpu .cyc{color:#9fb0c0;font-family:var(--mono)}.sync{color:#9fb0c0}.sync.ok{color:#7fdc9f}.sync.bad{color:#ffb04a}
#pmenu{display:none;position:absolute;left:10px;top:50px;z-index:60;background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:0 14px 40px rgba(0,0,0,.25);min-width:290px;padding:6px}
#pmenu.on{display:block}
#pmenu .mhd{padding:8px 10px 10px;border-bottom:1px solid var(--line);margin-bottom:4px}#pmenu .mhd small{display:block;color:var(--mute);font-size:11.5px;word-break:break-all}
#pmenu .mi{display:flex;width:100%;justify-content:space-between;align-items:center;border:0;background:none;text-align:left;padding:8px 10px;border-radius:6px}
#pmenu .mi:hover{background:var(--acc2)}#pmenu .mi small{color:var(--mute)}#pmenu kbd{font:11px var(--mono);color:var(--mute)}
#pmenu .msep{height:1px;background:var(--line);margin:4px 6px}
/* Layout */
#wrap{flex:1;display:flex;min-height:0;position:relative}
#nav{width:250px;background:var(--pane);border-right:1px solid var(--line);overflow:auto;flex-shrink:0}
.navh{font-size:11px;text-transform:uppercase;letter-spacing:.8px;color:var(--mute);padding:10px 12px 4px;font-weight:600}
.tn{padding:5px 12px;display:flex;align-items:center;gap:7px;white-space:nowrap;overflow:hidden}
.tn small{color:var(--mute);font-size:11px;margin-left:auto}
.tn.root{font-weight:600}.tn.root small{margin-left:4px;overflow:hidden;text-overflow:ellipsis}
.tn.grp{font-size:12px;color:var(--mute);font-weight:600;padding-top:10px}
.tn.item{cursor:pointer;padding-left:20px;border-left:3px solid transparent}.tn.item:hover{background:#f2f5f8}.tn.item.sel{background:var(--acc2);border-left-color:var(--acc)}
.tn.add{cursor:pointer;padding-left:20px;color:var(--acc);font-weight:500}
.tn .bn{overflow:hidden;text-overflow:ellipsis}
.tn .dot{width:8px;height:8px;border-radius:50%;background:var(--err);flex-shrink:0}
.bt{font:600 10px var(--mono);padding:2px 4px;border-radius:3px;color:#fff;background:#6c7a89}.bt.OB{background:#7b4fc4}.bt.FB{background:#1f5fbf}.bt.FC{background:#0c8a7d}.bt.DB{background:#b0701a}
.ico{width:14px;height:14px;border-radius:3px;display:inline-block;flex-shrink:0;background:#c7d0d9}.cpu-i{background:#26333f}.tag-i{background:repeating-linear-gradient(#8fa1b3 0 2px,transparent 2px 4px)}.watch-i{border-radius:50%;background:radial-gradient(#14a34a 35%,#cfe9d8 40%)}.diag-i{background:#f0a020}.src-i{background:#4b8fe8}
#ed{flex:1;overflow:auto;padding:14px 18px 40px;min-width:0}
#scrim{display:none}
/* Bibliothek */
#lib{width:300px;background:var(--pane);border-left:1px solid var(--line);display:none;flex-direction:column;flex-shrink:0;min-height:0}
body.haslib #lib{display:flex}
.libh{display:flex;align-items:center;gap:8px;padding:10px 12px 6px}.libh small{color:var(--mute);font-family:var(--mono);background:#eef2f6;border-radius:4px;padding:1px 5px}.libh .libx{display:none;margin-left:auto;border:0;background:none;font-size:16px}
.libs{padding:0 10px 8px}.libs input{width:100%;border:1px solid var(--line);border-radius:7px;padding:7px 9px;font-size:13px}
.libt{flex:1;overflow:auto;border-top:1px solid var(--line)}
.libt details{border-bottom:1px solid #eef1f4}.libt summary{padding:7px 12px;font-weight:600;font-size:13px;cursor:pointer;list-style:none;display:flex;gap:6px;align-items:center}
.libt summary::before{content:'▸';font-size:10px;color:var(--mute);width:10px}.libt details[open]>summary::before{content:'▾'}
.libt summary small{color:var(--mute);font-weight:400;margin-left:auto}
.li{display:flex;gap:8px;align-items:center;padding:5px 12px 5px 26px;cursor:pointer;font-size:12.5px}
.li:hover{background:var(--acc2)}.li.cur{background:#dde8fa}
.li .sym{min-width:70px;max-width:110px;font-size:11.5px;font-weight:600;color:#1d4580;background:#f1f5fb;border:1px solid #d9e3f2;border-radius:4px;padding:1px 5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li .lt{color:#33414f;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.libinfo{border-top:1px solid var(--line);padding:10px 12px;max-height:38%;overflow:auto;font-size:12.5px;background:#fbfcfd}
.libinfo .lih{font-weight:600;margin-bottom:4px}.libinfo .sym{font-size:11.5px;color:#1d4580}.libinfo p{margin:4px 0 6px;color:#3a4856}
table.pins{border-collapse:collapse;width:100%;font-size:11.5px}table.pins th,table.pins td{text-align:left;padding:2px 6px;border-bottom:1px solid #edf0f3}table.pins td:first-child{font-family:var(--mono)}
.snipv{font:11.5px/1.45 var(--mono);background:#fff;border:1px solid var(--line);border-radius:6px;padding:6px 8px;margin:6px 0 0;white-space:pre;overflow:auto}
/* Info */
#info{background:var(--pane);border-top:1px solid var(--line);max-height:34px;transition:max-height .2s;overflow:hidden;flex-shrink:0}
#info.open{max-height:32vh}
.infoh{display:flex;gap:10px;align-items:center;padding:7px 14px;cursor:pointer;font-size:13px;border-bottom:1px solid var(--line)}
.infoh .cnt.e{color:var(--err)}.infoh .cnt.w{color:var(--warn)}.infoh .chev{margin-left:auto}
.infob{overflow:auto;max-height:calc(32vh - 34px)}
.msg{display:flex;gap:10px;padding:5px 14px;font-size:13px;border-bottom:1px solid #eef1f4;cursor:pointer}.msg:hover{background:#f5f7f9}
.msg .mi{width:14px}.msg.err .mi{color:var(--err)}.msg.warn .mi{color:var(--warn)}.msg.ok .mi{color:var(--on)}
.msg .mw{color:var(--mute);min-width:130px;font-family:var(--mono);font-size:12px}
/* Editor allgemein */
.edh{display:flex;align-items:flex-start;gap:12px;margin-bottom:12px;flex-wrap:wrap}
.edh h2{margin:0;font-size:19px;display:flex;align-items:center;gap:8px}.edh h2 small{font-weight:400;color:var(--mute);font-size:13px}
.edh .sub{color:var(--mute);font-size:13px;margin-top:2px}.edh .acts{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.lsel{font-size:12.5px;color:var(--mute);display:flex;gap:6px;align-items:center}.lsel select{border:1px solid var(--line);border-radius:6px;padding:4px 6px;font-weight:600;color:var(--ink)}
.hint{color:var(--mute)}.hint.small,.small{font-size:12.5px}
.tw{overflow:auto;background:var(--pane);border:1px solid var(--line);border-radius:8px}.tw.tabbed{border-top-left-radius:0}
table.grid{border-collapse:collapse;width:100%;font-size:13px}
.grid th{background:#f3f6f9;text-align:left;font-weight:600;padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap;font-size:12px;color:#3a4856}
.grid td{border-bottom:1px solid #edf0f3;padding:2px 4px}
.grid input,.grid select{width:100%;border:1px solid transparent;background:transparent;padding:4px 5px;border-radius:4px;min-width:70px}
.grid input:hover,.grid select:hover{border-color:var(--line)}.grid input:focus{border-color:var(--acc);background:#fff;outline:none}
.grid tr.sec td{background:#f8fafb;font-weight:600;font-size:12px;padding:5px 8px}.grid tr.sec button{margin-left:10px}
.grid tr.err td{color:var(--err)}.grid tr.warn td{color:var(--warn)}
td.live,th.live{min-width:110px}td.live{color:#1d4580;font-size:12.5px;padding-left:8px}td.live.t{color:var(--on);font-weight:600}
body:not(.live) td.live,body:not(.live) th.live{display:none}
button.x{border:0;background:none;color:#9aa6b2;padding:4px 8px}button.x:hover{color:var(--err)}
button.mini{padding:2px 8px;font-size:12px}
.tabs{display:flex;gap:2px;margin-bottom:-1px;position:relative;z-index:1;flex-wrap:wrap}
.tab{border-radius:8px 8px 0 0;border-bottom-color:transparent;background:#f3f6f9;color:var(--mute);padding:7px 14px;display:flex;gap:7px;align-items:center}
.tab small{font-size:11px;background:#e1e7ee;border-radius:9px;padding:0 6px;color:var(--mute)}
.tab.on{background:#fff;color:var(--ink);font-weight:600;border-color:var(--line);border-bottom-color:#fff}.tab.on small{background:var(--acc2);color:var(--acc)}
.ar{font:600 10.5px var(--mono);border-radius:3px;padding:1px 5px;color:#fff;background:#9aa6b2;margin-left:4px}.ar.I{background:#14a34a}.ar.Q{background:#d97706}.ar.M{background:#1f5fbf}
details.iface{background:var(--pane);border:1px solid var(--line);border-radius:8px;margin-bottom:12px}
details.iface summary{padding:8px 12px;font-weight:600;cursor:pointer;font-size:13px}
details.iface .tw{border:0;border-top:1px solid var(--line);border-radius:0 0 8px 8px}
/* SCL */
.sclt{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:6px}.snip{font:500 12px var(--mono);padding:3px 8px}
.scl{display:flex;background:#fbfcfd;border:1px solid var(--line);border-radius:8px;max-height:calc(100vh - 250px);min-height:260px;overflow:auto;font:var(--fs)/var(--lh) var(--mono)}
.gut{position:sticky;left:0;background:#f0f3f6;color:#94a1ae;text-align:right;padding:8px 8px 8px 10px;user-select:none;border-right:1px solid var(--line);z-index:2;min-height:100%;height:max-content}
.gut div{height:var(--lh)}.gut div.e{color:#fff;background:var(--err);border-radius:3px}
.code{position:relative;flex:1;min-width:max-content}
.code pre{margin:0;padding:8px 12px 40px;white-space:pre;pointer-events:none;font:inherit;min-height:100%}
.code textarea{position:absolute;inset:0;width:100%;height:100%;padding:8px 12px 40px;border:0;resize:none;background:transparent;color:transparent;caret-color:#111;font:inherit;white-space:pre;overflow:hidden;outline:none;z-index:1}
.code textarea::selection{background:rgba(31,95,191,.25);color:transparent}
.errlay .el{position:absolute;left:0;right:0;height:var(--lh);background:rgba(210,59,47,.12);border-left:3px solid var(--err)}.errlay .el.warn{background:rgba(201,132,0,.12);border-left-color:var(--warn)}
i{font-style:normal}i.c{color:#6a8a5a;font-style:italic}i.g{color:#b0701a}i.s{color:#a33d8b}i.l{color:#1f5fbf}i.n{color:#0c8a7d}i.k{color:#7b2fbf;font-weight:600}i.f{color:#c0392b}i.lb{color:#c0392b;font-weight:600}i.bad{color:var(--err);text-decoration:underline wavy}
.errlist{margin-top:8px;background:var(--pane);border:1px solid var(--line);border-radius:8px}
.srcpre{background:#fbfcfd;border:1px solid var(--line);border-radius:8px;padding:10px 12px;font:12.5px/1.5 var(--mono);overflow:auto;max-height:55vh;margin:6px 0 0}
/* AWL */
.awl{display:flex;background:#fbfcfd;border:1px solid var(--line);border-radius:8px;overflow-x:auto;font:var(--fs)/var(--lh) var(--mono);margin-top:4px}
.awl .gut{padding:6px 8px 6px 10px}.awl .code pre{padding:6px 12px 14px;min-height:calc(var(--lh) * 3)}.awl .code textarea{padding:6px 12px 14px}
.awl .errlay .el{height:var(--lh)}
.mon{border-left:1px solid var(--line);background:#f6f8fa;min-width:120px;padding:6px 8px 14px;position:sticky;right:0;font-size:11.5px;display:none}
body.live .mon{display:block}
.mon .mh{position:absolute;top:-1px;right:8px;font:600 9px var(--mono);color:var(--mute);display:none}
.mon .ml{height:var(--lh);display:flex;gap:8px;align-items:center;white-space:nowrap}.mon .ml.stale{opacity:.4}
.vke{display:inline-block;width:16px;text-align:center;border-radius:3px;font-weight:600;color:#fff}.vke.t{background:var(--on)}.vke.f{background:var(--off)}
.ak{color:#1d4580}
/* Werkzeuge / Netzwerke */
.tools{position:sticky;top:-14px;z-index:5;background:var(--bg);display:flex;gap:10px;padding:6px 0 8px;overflow-x:auto;flex-wrap:wrap}
.tg{display:flex;gap:3px;align-items:center;background:var(--pane);border:1px solid var(--line);border-radius:8px;padding:4px 6px;flex-wrap:wrap}
.tg>span{font-size:10.5px;color:var(--mute);text-transform:uppercase;letter-spacing:.6px;margin-right:4px;font-weight:600}
.tl{font:600 12px var(--mono);padding:4px 7px;white-space:nowrap}
.net{background:var(--pane);border:1px solid var(--line);border-radius:10px;margin:10px 0;padding:8px 10px 10px}
.net.act{border-color:#9db9e6}.net.bad{border-color:#e6a49d;box-shadow:inset 3px 0 0 var(--err)}.net.flash{animation:fl 1.2s}@keyframes fl{0%{background:#fff4d6}100%{background:#fff}}
.neth{display:flex;align-items:center;gap:8px;font-size:13px}.neth .ntitle{flex:1;min-width:80px;border:1px solid transparent;border-radius:5px;padding:3px 6px;font-weight:500}.neth .ntitle:hover,.ncom:hover,.nlabel:hover{border-color:var(--line)}
.nlabel{width:72px;border:1px solid transparent;border-radius:5px;padding:3px 6px;font-size:12px;color:#c0392b}
.nacts{display:flex;gap:3px}.ncom{width:100%;border:1px solid transparent;border-radius:5px;padding:2px 6px;color:var(--mute);font-size:12.5px;margin:2px 0 4px}
.nerr{font-size:12.5px;margin:4px 0}.nerr .err{color:var(--err)}.nerr .warn{color:var(--warn)}
.cv{overflow-x:auto;padding:4px 0;position:relative;min-height:40px}
svg.nsvg{display:block;font-family:var(--mono)}
svg .w,svg .sym line,svg .sym path{stroke:#2b3a48;stroke-width:1.6;fill:none}
svg .rail{stroke:#2b3a48;stroke-width:4}
svg .bx{fill:#fff;stroke:#2b3a48;stroke-width:1.5;cursor:pointer}svg .bx:hover{fill:#f5f8fd}svg .bx.sel{stroke:var(--acc);stroke-width:2.4;fill:#eef4fd}svg .bx.bad{stroke:var(--err)}
svg .btl{font-size:12px;font-weight:600;fill:#18222d;pointer-events:none}svg .bsub{font-size:10px;fill:#5d6b79;pointer-events:none}
svg .pl{font-size:10.5px;fill:#33414f;pointer-events:none}
svg .op{font-size:11.5px;fill:#1f5fbf;cursor:text}svg .op:hover{text-decoration:underline}svg .op.ph{fill:var(--err)}svg .op.opt{fill:#9aa6b2}svg .op.ro{fill:#7b8794;font-style:italic}
svg .mv{font-size:9.5px;fill:var(--on);font-weight:600;pointer-events:none}
svg .bx.open{stroke:#9aa6b2;stroke-dasharray:4 3}svg .sym.openc line,svg .sym.openc path{stroke:#9aa6b2;stroke-dasharray:3 3}
svg .neg{fill:#fff;stroke:#2b3a48;stroke-width:1.5}
svg .sl{font-size:11px;font-weight:700;fill:#18222d;pointer-events:none}
svg .hit{fill:transparent;cursor:pointer}svg .hit:hover{fill:rgba(31,95,191,.07)}svg .hit.selw{fill:rgba(31,95,191,.18)}
svg .selr{fill:#eef4fd;stroke:var(--acc);stroke-width:1.5;stroke-dasharray:4 3}
svg .emptyt{font:12.5px 'IBM Plex Sans',sans-serif;fill:#8a96a3}
body.live svg .w.on,body.live svg .sym.on line,body.live svg .sym.on path{stroke:var(--on);stroke-width:2.2}
body.live svg .w.off,body.live svg .sym.off line,body.live svg .sym.off path{stroke:var(--off);stroke-dasharray:5 3}
body.live svg .bx.on{stroke:var(--on);fill:var(--onbg)}
.opedit{position:absolute;z-index:8;border:2px solid var(--acc);border-radius:5px;padding:3px 6px;font-size:13px;background:#fff;box-shadow:0 4px 14px rgba(0,0,0,.15)}
.props{margin-top:8px;border-top:1px dashed var(--line);padding-top:8px}.ph2{font-weight:600;font-size:13px;margin-bottom:6px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}.ph2 .sp{flex:1}
.pf{display:flex;flex-wrap:wrap;gap:8px 10px;align-items:flex-end}.pf label{display:flex;flex-direction:column;font-size:11.5px;color:var(--mute);gap:2px}.pf label small{font-family:var(--mono);color:#8a96a3}
.pf input,.pf select{border:1px solid var(--line);border-radius:5px;padding:4px 6px;width:170px;color:var(--ink);font-size:13px}
.pf .wide{flex-basis:100%}.pf .wide input{width:100%}.pf .row{display:flex;gap:6px;align-items:center}.pf .cnt{min-width:22px;text-align:center;color:var(--ink)}
.pf label.chk{flex-direction:row;align-items:center;gap:6px;color:var(--ink);font-size:13px}.pf label.chk input{width:auto}
.addnet{width:100%;padding:10px;border-style:dashed;color:var(--acc);background:transparent;margin-top:6px}
/* Beobachtung */
.panel{background:var(--pane);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:12px}.panel .tw{border-radius:6px}
.sw{font-weight:400;font-size:12.5px;color:var(--mute);margin-left:auto;display:flex;gap:5px;align-items:center}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.chip{display:flex;flex-direction:column;align-items:flex-start;padding:8px 12px;border-radius:9px;border:1.5px solid var(--line);background:#f6f8fa;min-width:120px;user-select:none;touch-action:manipulation}
.chip b{font-size:13px;font-weight:600}.chip small{font-family:var(--mono);color:var(--mute);font-size:11px}
body.live .chip.on{background:var(--onbg);border-color:var(--on)}body.live .chip.on b::before{content:'● ';color:var(--on)}
.chip.out{cursor:default}body.live .chip.out.on{background:#fff3cf;border-color:#f0a020}body.live .chip.out.on b::before{color:#f0a020}
.ana{display:grid;grid-template-columns:150px 70px 1fr 90px;gap:10px;align-items:center;margin-bottom:10px;font-size:13px}.ana small{font-family:var(--mono);color:var(--mute)}
.banner{background:#fff6e0;border:1px solid #f1d394;border-radius:8px;padding:8px 12px;margin-bottom:12px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.cpup{display:flex;gap:20px;flex-wrap:wrap;align-items:center}.cpubig{font:700 26px var(--mono);display:flex;align-items:center;gap:10px}.cpubig .led{width:18px;height:18px;border-radius:50%;background:#f0a020}.cpubig.RUN .led{background:#2ad16a;box-shadow:0 0 10px #2ad16a}
.cpub{display:flex;gap:6px;flex-wrap:wrap}.cpub .run{background:#155f33;color:#fff;border-color:#155f33}.cpub .stop{background:#a8650c;color:#fff;border-color:#a8650c}
table.kv td{padding:3px 10px 3px 0;font-size:13px}
textarea.imp{width:100%;min-height:110px;margin:6px 0;border:1px solid var(--line);border-radius:6px;padding:8px;font-size:12.5px}
/* Dialog & Toast */
#modal{position:fixed;inset:0;background:rgba(20,30,40,.45);display:none;align-items:center;justify-content:center;z-index:80;padding:16px}#modal.on{display:flex}
.mbox{background:#fff;border-radius:12px;padding:18px 20px;width:min(560px,100%);max-height:90vh;overflow:auto;box-shadow:0 20px 50px rgba(0,0,0,.3)}.mbox.wide{width:min(720px,100%)}
.mbox h3{margin:0 0 12px}.mbtn{display:flex;justify-content:flex-end;gap:8px;margin-top:14px;flex-wrap:wrap}
.fl{display:flex;flex-direction:column;gap:3px;font-size:12.5px;color:var(--mute);margin:10px 0}.fl input,.fl select{border:1px solid var(--line);border-radius:6px;padding:7px 8px;color:var(--ink);font-size:14px}.fl small{color:#8a96a3}
.seg{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}.seg label{cursor:pointer}.seg input{display:none}
.seg span{display:flex;flex-direction:column;border:1.5px solid var(--line);border-radius:8px;padding:8px;font-size:11px;color:var(--mute);height:100%}.seg span b{font:700 16px var(--mono);color:var(--ink)}
.seg input:checked+span{border-color:var(--acc);background:var(--acc2)}
.lcards{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:6px 0 10px}
.lcard{cursor:pointer;display:block}.lcard input{display:none}.lcard.mixed{display:block;margin-bottom:8px}
.lcard span{display:flex;flex-direction:column;gap:2px;border:1.5px solid var(--line);border-radius:10px;padding:10px;height:100%}
.lcard b{font:700 20px var(--mono)}.lcard em{font-style:normal;font-size:12px;font-weight:600}.lcard small{font-size:11.5px;color:var(--mute);line-height:1.35}
.lcard input:checked+span{border-color:var(--acc);background:var(--acc2);box-shadow:0 0 0 2px rgba(31,95,191,.15)}
.lcard.dis{opacity:.45;cursor:not-allowed}
label.chk{display:flex;gap:8px;align-items:center;font-size:13.5px;margin:6px 0}
table.rep{width:100%;border-collapse:collapse;font-size:13px}table.rep td{padding:4px 8px;border-bottom:1px solid #eef1f4}table.rep .ok{color:var(--on)}table.rep .warn{color:var(--warn)}
.welcome{text-align:center;margin-bottom:10px}.welcome h3{margin:10px 0 4px}
.startbtns{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.startbtns button{display:flex;flex-direction:column;align-items:flex-start;gap:4px;padding:14px;text-align:left;border-radius:10px}.startbtns small{font-size:12px;opacity:.8}
#toast{position:fixed;bottom:50px;left:50%;transform:translate(-50%,20px);background:#1c2731;color:#fff;padding:9px 16px;border-radius:8px;font-size:13.5px;opacity:0;pointer-events:none;transition:.2s;z-index:90;max-width:90vw}
#toast.show{opacity:1;transform:translate(-50%,0)}#toast.err{background:#a52a20}#toast.ok{background:#155f33}#toast.warn{background:#8a5a00}
/* Schmale Fenster */
@media (max-width:1180px){ #lib{position:absolute;right:0;top:0;bottom:0;z-index:30;transform:translateX(102%);transition:transform .2s;box-shadow:-4px 0 20px rgba(0,0,0,.2);width:min(320px,90vw)} #lib.open{transform:none} #top .tb .libbtn{display:flex} .libh .libx{display:block} #scrim.on{display:block;position:absolute;inset:0;background:rgba(0,0,0,.3);z-index:20} }
@media (max-width:820px){
  :root{--fs:16px;--lh:22px}
  #top{gap:6px;padding:6px 8px}#top .navt{display:block}.pinfo{display:none}#top .tb .t{display:none}#top .tb button{padding:6px 10px}.logo-btn .bt1{display:none}
  .cpu{margin-left:0;width:100%;justify-content:center}.cpu .sync{font-size:11.5px}#pmenu{top:46px;left:6px;right:6px;min-width:0}
  #nav{position:absolute;left:0;top:0;bottom:0;z-index:30;transform:translateX(-102%);transition:transform .2s;box-shadow:4px 0 20px rgba(0,0,0,.2);width:min(300px,86vw)}
  #nav.open{transform:none}
  #ed{padding:10px 10px 40px}.tools{flex-wrap:nowrap;top:-10px}.msg .mw{min-width:80px}
  .grid input,.grid select{font-size:16px}.pf input,.pf select,.opedit,.libs input{font-size:16px}.ana{grid-template-columns:1fr 60px;}.ana input{grid-column:1/-1}
  .seg,.lcards{grid-template-columns:repeat(2,1fr)}.startbtns{grid-template-columns:1fr}.edh .acts{margin-left:0}
}
</style>

<div id="modal"></div><div id="toast"></div>
