<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SPS-Werkbank – KOP, FUP, SCL &amp; AWL</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#e9edf1;--pane:#fff;--line:#d3dae2;--ink:#18222d;--mute:#5d6b79;--acc:#1f5fbf;--acc2:#e8f0fc;--top:#1c2731;--top2:#26333f;--on:#14a34a;--onbg:#dff5e7;--off:#3f72c9;--err:#d23b2f;--warn:#c98400;--mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;--lh:20px;--fs:13px}
*{box-sizing:border-box}html,body{margin:0;height:100%}
body{font:14px/1.4 'IBM Plex Sans',system-ui,sans-serif;color:var(--ink);background:var(--bg);display:flex;flex-direction:column;overflow:hidden}
button{font:inherit;cursor:pointer;border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:6px;padding:5px 10px}
button:hover{border-color:#a9b6c3}button.pri{background:var(--acc);border-color:var(--acc);color:#fff}button.danger{color:var(--err)}button:disabled{opacity:.45;cursor:not-allowed}
input,select,textarea{font:inherit;color:inherit}
.mono{font-family:var(--mono)}
/* Kopf */
#top{background:var(--top);color:#e8eef4;display:flex;align-items:center;gap:10px;padding:6px 12px;flex-wrap:wrap;border-bottom:3px solid #f0a020;position:relative;z-index:40}
.logo{width:20px;height:20px;border-radius:4px;background:linear-gradient(135deg,#f0a020 0 50%,#4b8fe8 50%);display:inline-block;flex-shrink:0}.logo.big{width:44px;height:44px;border-radius:9px}
.logo-btn{display:flex;align-items:center;gap:8px;background:transparent;border:1px solid transparent;color:#fff;font-weight:700;padding:5px 9px;border-radius:7px}
.logo-btn:hover,.logo-btn.act{background:var(--top2);border-color:#3a4957}.logo-btn .car{font-size:11px;opacity:.7}
.pinfo{display:flex;flex-direction:column;line-height:1.15;min-width:0}.pinfo b{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:220px}.pinfo small{color:#9fb0c0;font-size:11px;white-space:nowrap}
#top .tb{display:flex;gap:4px;flex-wrap:wrap}
#top .tb button{background:var(--top2);border-color:#3a4957;color:#e8eef4;display:flex;gap:6px;align-items:center}
#top .tb button:hover{background:#31414f}
#top .tb .run.act{background:#155f33;border-color:#1f8a4a}#top .tb .stop.act{background:#6b3d06;border-color:#a8650c}#top .tb .mon.act{background:#1d4580;border-color:#3069c1}
#top .tb .libbtn{display:none}
#top .i{font-size:13px}
#top .navt{display:none;background:none;border:0;color:#fff;font-size:20px;padding:2px 6px}
.cpu{margin-left:auto;display:flex;align-items:center;gap:8px;font-size:12.5px;background:var(--top2);padding:4px 10px;border-radius:20px;white-space:nowrap}
.cpu .led{width:10px;height:10px;border-radius:50%;background:#f0a020;box-shadow:0 0 6px #f0a020}.cpu.RUN .led{background:#2ad16a;box-shadow:0 0 8px #2ad16a}
.cpu .cyc{color:#9fb0c0;font-family:var(--mono)}.sync{color:#9fb0c0}.sync.ok{color:#7fdc9f}.sync.bad{color:#ffb04a}
#pmenu{display:none;position:absolute;left:10px;top:50px;z-index:60;background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:0 14px 40px rgba(0,0,0,.25);min-width:290px;padding:6px}
#pmenu.on{display:block}
#pmenu .mhd{padding:8px 10px 10px;border-bottom:1px solid var(--line);margin-bottom:4px}#pmenu .mhd small{display:block;color:var(--mute);font-size:11.5px;word-break:break-all}
#pmenu .mi{display:flex;width:100%;justify-content:space-between;align-items:center;border:0;background:none;text-align:left;padding:8px 10px;border-radius:6px}
#pmenu .mi:hover{background:var(--acc2)}#pmenu .mi small{color:var(--mute)}#pmenu kbd{font:11px var(--mono);color:var(--mute)}
#pmenu .msep{height:1px;background:var(--line);margin:4px 6px}
/* Layout */
#wrap{flex:1;display:flex;min-height:0;position:relative}
#nav{width:250px;background:var(--pane);border-right:1px solid var(--line);overflow:auto;flex-shrink:0}
.navh{font-size:11px;text-transform:uppercase;letter-spacing:.8px;color:var(--mute);padding:10px 12px 4px;font-weight:600}
.tn{padding:5px 12px;display:flex;align-items:center;gap:7px;white-space:nowrap;overflow:hidden}
.tn small{color:var(--mute);font-size:11px;margin-left:auto}
.tn.root{font-weight:600}.tn.root small{margin-left:4px;overflow:hidden;text-overflow:ellipsis}
.tn.grp{font-size:12px;color:var(--mute);font-weight:600;padding-top:10px}
.tn.item{cursor:pointer;padding-left:20px;border-left:3px solid transparent}.tn.item:hover{background:#f2f5f8}.tn.item.sel{background:var(--acc2);border-left-color:var(--acc)}
.tn.add{cursor:pointer;padding-left:20px;color:var(--acc);font-weight:500}
.tn .bn{overflow:hidden;text-overflow:ellipsis}
.tn .dot{width:8px;height:8px;border-radius:50%;background:var(--err);flex-shrink:0}
.bt{font:600 10px var(--mono);padding:2px 4px;border-radius:3px;color:#fff;background:#6c7a89}.bt.OB{background:#7b4fc4}.bt.FB{background:#1f5fbf}.bt.FC{background:#0c8a7d}.bt.DB{background:#b0701a}
.ico{width:14px;height:14px;border-radius:3px;display:inline-block;flex-shrink:0;background:#c7d0d9}.cpu-i{background:#26333f}.tag-i{background:repeating-linear-gradient(#8fa1b3 0 2px,transparent 2px 4px)}.watch-i{border-radius:50%;background:radial-gradient(#14a34a 35%,#cfe9d8 40%)}.diag-i{background:#f0a020}.src-i{background:#4b8fe8}
#ed{flex:1;overflow:auto;padding:14px 18px 40px;min-width:0}
#scrim{display:none}
/* Bibliothek */
#lib{width:300px;background:var(--pane);border-left:1px solid var(--line);display:none;flex-direction:column;flex-shrink:0;min-height:0}
body.haslib #lib{display:flex}
.libh{display:flex;align-items:center;gap:8px;padding:10px 12px 6px}.libh small{color:var(--mute);font-family:var(--mono);background:#eef2f6;border-radius:4px;padding:1px 5px}.libh .libx{display:none;margin-left:auto;border:0;background:none;font-size:16px}
.libs{padding:0 10px 8px}.libs input{width:100%;border:1px solid var(--line);border-radius:7px;padding:7px 9px;font-size:13px}
.libt{flex:1;overflow:auto;border-top:1px solid var(--line)}
.libt details{border-bottom:1px solid #eef1f4}.libt summary{padding:7px 12px;font-weight:600;font-size:13px;cursor:pointer;list-style:none;display:flex;gap:6px;align-items:center}
.libt summary::before{content:'▸';font-size:10px;color:var(--mute);width:10px}.libt details[open]>summary::before{content:'▾'}
.libt summary small{color:var(--mute);font-weight:400;margin-left:auto}
.li{display:flex;gap:8px;align-items:center;padding:5px 12px 5px 26px;cursor:pointer;font-size:12.5px}
.li:hover{background:var(--acc2)}.li.cur{background:#dde8fa}
.li .sym{min-width:70px;max-width:110px;font-size:11.5px;font-weight:600;color:#1d4580;background:#f1f5fb;border:1px solid #d9e3f2;border-radius:4px;padding:1px 5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li .lt{color:#33414f;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.libinfo{border-top:1px solid var(--line);padding:10px 12px;max-height:38%;overflow:auto;font-size:12.5px;background:#fbfcfd}
.libinfo .lih{font-weight:600;margin-bottom:4px}.libinfo .sym{font-size:11.5px;color:#1d4580}.libinfo p{margin:4px 0 6px;color:#3a4856}
table.pins{border-collapse:collapse;width:100%;font-size:11.5px}table.pins th,table.pins td{text-align:left;padding:2px 6px;border-bottom:1px solid #edf0f3}table.pins td:first-child{font-family:var(--mono)}
.snipv{font:11.5px/1.45 var(--mono);background:#fff;border:1px solid var(--line);border-radius:6px;padding:6px 8px;margin:6px 0 0;white-space:pre;overflow:auto}
/* Info */
#info{background:var(--pane);border-top:1px solid var(--line);max-height:34px;transition:max-height .2s;overflow:hidden;flex-shrink:0}
#info.open{max-height:32vh}
.infoh{display:flex;gap:10px;align-items:center;padding:7px 14px;cursor:pointer;font-size:13px;border-bottom:1px solid var(--line)}
.infoh .cnt.e{color:var(--err)}.infoh .cnt.w{color:var(--warn)}.infoh .chev{margin-left:auto}
.infob{overflow:auto;max-height:calc(32vh - 34px)}
.msg{display:flex;gap:10px;padding:5px 14px;font-size:13px;border-bottom:1px solid #eef1f4;cursor:pointer}.msg:hover{background:#f5f7f9}
.msg .mi{width:14px}.msg.err .mi{color:var(--err)}.msg.warn .mi{color:var(--warn)}.msg.ok .mi{color:var(--on)}
.msg .mw{color:var(--mute);min-width:130px;font-family:var(--mono);font-size:12px}
/* Editor allgemein */
.edh{display:flex;align-items:flex-start;gap:12px;margin-bottom:12px;flex-wrap:wrap}
.edh h2{margin:0;font-size:19px;display:flex;align-items:center;gap:8px}.edh h2 small{font-weight:400;color:var(--mute);font-size:13px}
.edh .sub{color:var(--mute);font-size:13px;margin-top:2px}.edh .acts{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.lsel{font-size:12.5px;color:var(--mute);display:flex;gap:6px;align-items:center}.lsel select{border:1px solid var(--line);border-radius:6px;padding:4px 6px;font-weight:600;color:var(--ink)}
.hint{color:var(--mute)}.hint.small,.small{font-size:12.5px}
.tw{overflow:auto;background:var(--pane);border:1px solid var(--line);border-radius:8px}.tw.tabbed{border-top-left-radius:0}
table.grid{border-collapse:collapse;width:100%;font-size:13px}
.grid th{background:#f3f6f9;text-align:left;font-weight:600;padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap;font-size:12px;color:#3a4856}
.grid td{border-bottom:1px solid #edf0f3;padding:2px 4px}
.grid input,.grid select{width:100%;border:1px solid transparent;background:transparent;padding:4px 5px;border-radius:4px;min-width:70px}
.grid input:hover,.grid select:hover{border-color:var(--line)}.grid input:focus{border-color:var(--acc);background:#fff;outline:none}
.grid tr.sec td{background:#f8fafb;font-weight:600;font-size:12px;padding:5px 8px}.grid tr.sec button{margin-left:10px}
.grid tr.err td{color:var(--err)}.grid tr.warn td{color:var(--warn)}
td.live,th.live{min-width:110px}td.live{color:#1d4580;font-size:12.5px;padding-left:8px}td.live.t{color:var(--on);font-weight:600}
body:not(.live) td.live,body:not(.live) th.live{display:none}
button.x{border:0;background:none;color:#9aa6b2;padding:4px 8px}button.x:hover{color:var(--err)}
button.mini{padding:2px 8px;font-size:12px}
.tabs{display:flex;gap:2px;margin-bottom:-1px;position:relative;z-index:1;flex-wrap:wrap}
.tab{border-radius:8px 8px 0 0;border-bottom-color:transparent;background:#f3f6f9;color:var(--mute);padding:7px 14px;display:flex;gap:7px;align-items:center}
.tab small{font-size:11px;background:#e1e7ee;border-radius:9px;padding:0 6px;color:var(--mute)}
.tab.on{background:#fff;color:var(--ink);font-weight:600;border-color:var(--line);border-bottom-color:#fff}.tab.on small{background:var(--acc2);color:var(--acc)}
.ar{font:600 10.5px var(--mono);border-radius:3px;padding:1px 5px;color:#fff;background:#9aa6b2;margin-left:4px}.ar.I{background:#14a34a}.ar.Q{background:#d97706}.ar.M{background:#1f5fbf}
details.iface{background:var(--pane);border:1px solid var(--line);border-radius:8px;margin-bottom:12px}
details.iface summary{padding:8px 12px;font-weight:600;cursor:pointer;font-size:13px}
details.iface .tw{border:0;border-top:1px solid var(--line);border-radius:0 0 8px 8px}
/* SCL */
.sclt{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:6px}.snip{font:500 12px var(--mono);padding:3px 8px}
.scl{display:flex;background:#fbfcfd;border:1px solid var(--line);border-radius:8px;max-height:calc(100vh - 250px);min-height:260px;overflow:auto;font:var(--fs)/var(--lh) var(--mono)}
.gut{position:sticky;left:0;background:#f0f3f6;color:#94a1ae;text-align:right;padding:8px 8px 8px 10px;user-select:none;border-right:1px solid var(--line);z-index:2;min-height:100%;height:max-content}
.gut div{height:var(--lh)}.gut div.e{color:#fff;background:var(--err);border-radius:3px}
.code{position:relative;flex:1;min-width:max-content}
.code pre{margin:0;padding:8px 12px 40px;white-space:pre;pointer-events:none;font:inherit;min-height:100%}
.code textarea{position:absolute;inset:0;width:100%;height:100%;padding:8px 12px 40px;border:0;resize:none;background:transparent;color:transparent;caret-color:#111;font:inherit;white-space:pre;overflow:hidden;outline:none;z-index:1}
.code textarea::selection{background:rgba(31,95,191,.25);color:transparent}
.errlay .el{position:absolute;left:0;right:0;height:var(--lh);background:rgba(210,59,47,.12);border-left:3px solid var(--err)}.errlay .el.warn{background:rgba(201,132,0,.12);border-left-color:var(--warn)}
i{font-style:normal}i.c{color:#6a8a5a;font-style:italic}i.g{color:#b0701a}i.s{color:#a33d8b}i.l{color:#1f5fbf}i.n{color:#0c8a7d}i.k{color:#7b2fbf;font-weight:600}i.f{color:#c0392b}i.lb{color:#c0392b;font-weight:600}i.bad{color:var(--err);text-decoration:underline wavy}
.errlist{margin-top:8px;background:var(--pane);border:1px solid var(--line);border-radius:8px}
.srcpre{background:#fbfcfd;border:1px solid var(--line);border-radius:8px;padding:10px 12px;font:12.5px/1.5 var(--mono);overflow:auto;max-height:55vh;margin:6px 0 0}
/* AWL */
.awl{display:flex;background:#fbfcfd;border:1px solid var(--line);border-radius:8px;overflow-x:auto;font:var(--fs)/var(--lh) var(--mono);margin-top:4px}
.awl .gut{padding:6px 8px 6px 10px}.awl .code pre{padding:6px 12px 14px;min-height:calc(var(--lh) * 3)}.awl .code textarea{padding:6px 12px 14px}
.awl .errlay .el{height:var(--lh)}
.mon{border-left:1px solid var(--line);background:#f6f8fa;min-width:120px;padding:6px 8px 14px;position:sticky;right:0;font-size:11.5px;display:none}
body.live .mon{display:block}
.mon .mh{position:absolute;top:-1px;right:8px;font:600 9px var(--mono);color:var(--mute);display:none}
.mon .ml{height:var(--lh);display:flex;gap:8px;align-items:center;white-space:nowrap}.mon .ml.stale{opacity:.4}
.vke{display:inline-block;width:16px;text-align:center;border-radius:3px;font-weight:600;color:#fff}.vke.t{background:var(--on)}.vke.f{background:var(--off)}
.ak{color:#1d4580}
/* Werkzeuge / Netzwerke */
.tools{position:sticky;top:-14px;z-index:5;background:var(--bg);display:flex;gap:10px;padding:6px 0 8px;overflow-x:auto;flex-wrap:wrap}
.tg{display:flex;gap:3px;align-items:center;background:var(--pane);border:1px solid var(--line);border-radius:8px;padding:4px 6px;flex-wrap:wrap}
.tg>span{font-size:10.5px;color:var(--mute);text-transform:uppercase;letter-spacing:.6px;margin-right:4px;font-weight:600}
.tl{font:600 12px var(--mono);padding:4px 7px;white-space:nowrap}
.net{background:var(--pane);border:1px solid var(--line);border-radius:10px;margin:10px 0;padding:8px 10px 10px}
.net.act{border-color:#9db9e6}.net.bad{border-color:#e6a49d;box-shadow:inset 3px 0 0 var(--err)}.net.flash{animation:fl 1.2s}@keyframes fl{0%{background:#fff4d6}100%{background:#fff}}
.neth{display:flex;align-items:center;gap:8px;font-size:13px}.neth .ntitle{flex:1;min-width:80px;border:1px solid transparent;border-radius:5px;padding:3px 6px;font-weight:500}.neth .ntitle:hover,.ncom:hover,.nlabel:hover{border-color:var(--line)}
.nlabel{width:72px;border:1px solid transparent;border-radius:5px;padding:3px 6px;font-size:12px;color:#c0392b}
.nacts{display:flex;gap:3px}.ncom{width:100%;border:1px solid transparent;border-radius:5px;padding:2px 6px;color:var(--mute);font-size:12.5px;margin:2px 0 4px}
.nerr{font-size:12.5px;margin:4px 0}.nerr .err{color:var(--err)}.nerr .warn{color:var(--warn)}
.cv{overflow-x:auto;padding:4px 0;position:relative;min-height:40px}
svg.nsvg{display:block;font-family:var(--mono)}
svg .w,svg .sym line,svg .sym path{stroke:#2b3a48;stroke-width:1.6;fill:none}
svg .rail{stroke:#2b3a48;stroke-width:4}
svg .bx{fill:#fff;stroke:#2b3a48;stroke-width:1.5;cursor:pointer}svg .bx:hover{fill:#f5f8fd}svg .bx.sel{stroke:var(--acc);stroke-width:2.4;fill:#eef4fd}svg .bx.bad{stroke:var(--err)}
svg .btl{font-size:12px;font-weight:600;fill:#18222d;pointer-events:none}svg .bsub{font-size:10px;fill:#5d6b79;pointer-events:none}
svg .pl{font-size:10.5px;fill:#33414f;pointer-events:none}
svg .op{font-size:11.5px;fill:#1f5fbf;cursor:text}svg .op:hover{text-decoration:underline}svg .op.ph{fill:var(--err)}svg .op.opt{fill:#9aa6b2}svg .op.ro{fill:#7b8794;font-style:italic}
svg .mv{font-size:9.5px;fill:var(--on);font-weight:600;pointer-events:none}
svg .bx.open{stroke:#9aa6b2;stroke-dasharray:4 3}svg .sym.openc line,svg .sym.openc path{stroke:#9aa6b2;stroke-dasharray:3 3}
svg .neg{fill:#fff;stroke:#2b3a48;stroke-width:1.5}
svg .sl{font-size:11px;font-weight:700;fill:#18222d;pointer-events:none}
svg .hit{fill:transparent;cursor:pointer}svg .hit:hover{fill:rgba(31,95,191,.07)}svg .hit.selw{fill:rgba(31,95,191,.18)}
svg .selr{fill:#eef4fd;stroke:var(--acc);stroke-width:1.5;stroke-dasharray:4 3}
svg .emptyt{font:12.5px 'IBM Plex Sans',sans-serif;fill:#8a96a3}
body.live svg .w.on,body.live svg .sym.on line,body.live svg .sym.on path{stroke:var(--on);stroke-width:2.2}
body.live svg .w.off,body.live svg .sym.off line,body.live svg .sym.off path{stroke:var(--off);stroke-dasharray:5 3}
body.live svg .bx.on{stroke:var(--on);fill:var(--onbg)}
.opedit{position:absolute;z-index:8;border:2px solid var(--acc);border-radius:5px;padding:3px 6px;font-size:13px;background:#fff;box-shadow:0 4px 14px rgba(0,0,0,.15)}
.props{margin-top:8px;border-top:1px dashed var(--line);padding-top:8px}.ph2{font-weight:600;font-size:13px;margin-bottom:6px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}.ph2 .sp{flex:1}
.pf{display:flex;flex-wrap:wrap;gap:8px 10px;align-items:flex-end}.pf label{display:flex;flex-direction:column;font-size:11.5px;color:var(--mute);gap:2px}.pf label small{font-family:var(--mono);color:#8a96a3}
.pf input,.pf select{border:1px solid var(--line);border-radius:5px;padding:4px 6px;width:170px;color:var(--ink);font-size:13px}
.pf .wide{flex-basis:100%}.pf .wide input{width:100%}.pf .row{display:flex;gap:6px;align-items:center}.pf .cnt{min-width:22px;text-align:center;color:var(--ink)}
.pf label.chk{flex-direction:row;align-items:center;gap:6px;color:var(--ink);font-size:13px}.pf label.chk input{width:auto}
.addnet{width:100%;padding:10px;border-style:dashed;color:var(--acc);background:transparent;margin-top:6px}
/* Beobachtung */
.panel{background:var(--pane);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:12px}.panel .tw{border-radius:6px}
.sw{font-weight:400;font-size:12.5px;color:var(--mute);margin-left:auto;display:flex;gap:5px;align-items:center}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.chip{display:flex;flex-direction:column;align-items:flex-start;padding:8px 12px;border-radius:9px;border:1.5px solid var(--line);background:#f6f8fa;min-width:120px;user-select:none;touch-action:manipulation}
.chip b{font-size:13px;font-weight:600}.chip small{font-family:var(--mono);color:var(--mute);font-size:11px}
body.live .chip.on{background:var(--onbg);border-color:var(--on)}body.live .chip.on b::before{content:'● ';color:var(--on)}
.chip.out{cursor:default}body.live .chip.out.on{background:#fff3cf;border-color:#f0a020}body.live .chip.out.on b::before{color:#f0a020}
.ana{display:grid;grid-template-columns:150px 70px 1fr 90px;gap:10px;align-items:center;margin-bottom:10px;font-size:13px}.ana small{font-family:var(--mono);color:var(--mute)}
.banner{background:#fff6e0;border:1px solid #f1d394;border-radius:8px;padding:8px 12px;margin-bottom:12px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}

<datalist id="typelist"></datalist><datalist id="oplist"></datalist>
<script>
'use strict';

/* ===================== Typen & IEC-Bausteine ===================== */
const INTR = { Int: [-32768, 32767], DInt: [-2147483648, 2147483647], SInt: [-128, 127], USInt: [0, 255], UInt: [0, 65535], UDInt: [0, 4294967295], Word: [0, 65535], DWord: [0, 4294967295], Byte: [0, 255], Time: [-2147483648, 2147483647] };

const BASIC_TYPES = ['Bool', 'Byte', 'Word', 'DWord', 'SInt', 'Int', 'DInt', 'USInt', 'UInt', 'UDInt', 'Real', 'LReal', 'Time'];
const TYPE_ALIAS = { bool: 'Bool', int: 'Int', dint: 'DInt', sint: 'SInt', usint: 'USInt', uint: 'UInt', udint: 'UDInt', word: 'Word', dword: 'DWord', byte: 'Byte', real: 'Real', lreal: 'LReal', time: 'Time',
  tonr_time: 'TONR_TIME', tonr: 'TONR_TIME', ctud_int: 'CTUD_INT', ctud: 'CTUD_INT', ctu_dint: 'CTU_INT', ctd_dint: 'CTD_INT', ctud_dint: 'CTUD_INT', ctu_udint: 'CTU_INT',
  ton_time: 'TON_TIME', ton: 'TON_TIME', tof_time: 'TOF_TIME', tof: 'TOF_TIME', tp_time: 'TP_TIME', tp: 'TP_TIME',
  ctu_int: 'CTU_INT', ctu: 'CTU_INT', ctd_int: 'CTD_INT', ctd: 'CTD_INT', r_trig: 'R_TRIG', f_trig: 'F_TRIG' };
const IEC = {
  TON_TIME: { ins: { IN: 'Bool', PT: 'Time' }, outs: { Q: 'Bool', ET: 'Time' }, run(s, now) {
    if (s.IN) { if (!s._r) { s._r = 1; s._t = now; } s.ET = Math.min(Math.round(now - s._t), s.PT); s.Q = s.ET >= s.PT; }
    else { s._r = 0; s.ET = 0; s.Q = false; } } },
  TOF_TIME: { ins: { IN: 'Bool', PT: 'Time' }, outs: { Q: 'Bool', ET: 'Time' }, run(s, now) {
    if (s.IN) { s.Q = true; s.ET = 0; s._r = 0; }
    else if (s.Q) { if (!s._r) { s._r = 1; s._t = now; } s.ET = Math.min(Math.round(now - s._t), s.PT); if (s.ET >= s.PT) s.Q = false; } } },
  TP_TIME: { ins: { IN: 'Bool', PT: 'Time' }, outs: { Q: 'Bool', ET: 'Time' }, run(s, now) {
    if (!s._a && s.IN && !s._p) { s._a = 1; s._t = now; }
    if (s._a) { s.ET = Math.round(now - s._t); if (s.ET >= s.PT) { s.ET = s.PT; s.Q = false; s._a = 0; } else s.Q = true; }
    else if (!s.IN) s.ET = 0;

  CTU_INT: { ins: { CU: 'Bool', R: 'Bool', PV: 'Int' }, outs: { Q: 'Bool', CV: 'Int' }, run(s) {

    s._p = s.CU; s.Q = s.CV >= s.PV; } },
  CTD_INT: { ins: { CD: 'Bool', LD: 'Bool', PV: 'Int' }, outs: { Q: 'Bool', CV: 'Int' }, run(s) {
    if (s.LD) s.CV = s.PV; else if (s.CD && !s._p && s.CV > -32768) s.CV--;
    s._p = s.CD; s.Q = s.CV <= 0; } },
  TONR_TIME: { ins: { IN: 'Bool', R: 'Bool', PT: 'Time' }, outs: { Q: 'Bool', ET: 'Time' }, run(s, now) {
    const acc = s._acc || 0;

  CTUD_INT: { ins: { CU: 'Bool', CD: 'Bool', R: 'Bool', LD: 'Bool', PV: 'Int' }, outs: { QU: 'Bool', QD: 'Bool', CV: 'Int' }, run(s) {
    if (s.R) s.CV = 0; else if (s.LD) s.CV = s.PV;
    else { if (s.CU && !s._pu && s.CV < 32767) s.CV++; if (s.CD && !s._pd && s.CV > -32768) s.CV--; }
    s._pu = s.CU; s._pd = s.CD; s.QU = s.CV >= s.PV; s.QD = s.CV <= 0; } },
  R_TRIG: { ins: { CLK: 'Bool' }, outs: { Q: 'Bool' }, run(s) { s.Q = !!s.CLK && !s._m; s._m = !!s.CLK; } },
  F_TRIG: { ins: { CLK: 'Bool' }, outs: { Q: 'Bool' }, run(s) { s.Q = !s.CLK && !!s._m; s._m = !!s.CLK; } },

const IEC_NAMES = Object.keys(IEC);
const SECTIONS = { OB: ['Temp'], FC: ['Input', 'Output', 'InOut', 'Temp'], FB: ['Input', 'Output', 'InOut', 'Static', 'Temp'], DB: ['Static'] };

class SclError { constructor(msg, line) { this.msg = msg; this.line = line; } }
class PlcError extends Error {}

function normType(t) { const s = String(t || '').trim().replace(/^"|"$/g, ''); return TYPE_ALIAS[s.toLowerCase()] || s; }
function canonType(t, reg) {
  const n = normType(t); if (TYPE_ALIAS[n.toLowerCase()] || IEC[n]) return n;
  const b = reg.blocks.get(n.toLowerCase()); return b ? b.name : n;
}
function typeKind(t, reg) {
  if (t === 'Bool') return 'bool'; if (NUMT.has(t)) return 'num'; if (IEC[t]) return 'iec';
  if (t.startsWith('DB:')) return 'db';
  const b = reg.blocks.get(t.toLowerCase()); if (b && b.type === 'FB') return 'fb';
  return null;
}
function isIntT(t) { return !!INTR[t]; }
function isRealT(t) { return t === 'Real' || t === 'LReal'; }

/* ===================== Lexer ===================== */
function parseTime(body, line) {
  let s = body.replace(/_/g, ''), neg = false; if (s[0] === '-') { neg = true; s = s.slice(1); }
  const re = /(\d+(?:\.\d+)?)(ms|d|h|m|s)/gi; let m, total = 0, used = 0;
  while ((m = re.exec(s))) { if (m.index !== used) break; used = re.lastIndex;
    const f = { ms: 1, s: 1000, m: 60000, h: 3600000, d: 86400000 }[m[2].toLowerCase()]; total += parseFloat(m[1]) * f; }

  return Math.round(neg ? -total : total);
}
function lex(src) {
  const toks = []; let i = 0, line = 1; const n = src.length;

    if (c === "'") { let j = i + 1; while (j < n && src[j] !== "'" && src[j] !== '\n') j++;
      if (src[j] !== "'") throw new SclError("Schließendes ' fehlt", line);
      toks.push({ t: 'str', v: src.slice(i + 1, j), line }); i = j + 1; continue; }
    if (c === '%') { const m = /^%([IQMEA])([BWD]?)(\d+)(?:\.(\d))?/i.exec(src.slice(i));
      if (!m) throw new SclError('Ungültige Adresse', line);
      toks.push({ t: 'abs', v: normAddr(m[0]), line }); i += m[0].length; continue; }
    if (c === '#') {
      if (src[i + 1] === '"') { let j = i + 2; while (j < n && src[j] !== '"' && src[j] !== '\n') j++;
        toks.push({ t: 'lid', v: src.slice(i + 2, j), line }); i = j + 1; continue; }
      let j = i + 1; while (idc(src[j])) j++;
      if (j === i + 1) throw new SclError('Name nach # erwartet', line);
      toks.push({ t: 'lid', v: src.slice(i + 1, j), line }); i = j; continue; }

/* ===================== Parser ===================== */
class Parser {

  expectKw(u) { if (!this.isKw(u)) this.err(u + ' erwartet'); return this.next(); }
  semi() { if (!this.isOp(';')) { const prev = this.k[this.p - 1]; throw new SclError('„;“ fehlt', prev ? prev.line : this.cur.line); } this.next(); }

    const out = [];

      const t = this.cur;

      if (t.t === 'id' && terms.includes(t.u)) break;
      if (terms.includes('NUM') && (t.t === 'num' || (t.t === 'op' && t.v === '-' && this.peek().t === 'num'))) break;
      const s = this.stmt(); if (s) out.push(s);
    }
    return out;
  }

    const out = [];

      catch (e) { if (!(e instanceof SclError)) throw e; errs.push({ line: e.line, msg: e.msg });

    }
    return out;
  }

    const t = this.cur; if (t.t !== 'num') this.err('Ganzzahl erwartet'); this.next(); return neg ? -t.v : t.v; }
  stmt() {

        case 'REPEAT': { this.next(); const body = this.stmtList(['UNTIL']); this.expectKw('UNTIL'); const c = this.expr(); this.expectKw('END_REPEAT'); this.semi(); return { k: 'repeat', c, body, line }; }

function dedent(s) { const ls = s.replace(/\t/g, '   ').split('\n'); while (ls.length && !ls[0].trim()) ls.shift(); while (ls.length && !ls[ls.length - 1].trim()) ls.pop();
  const ind = Math.min(...ls.filter(l => l.trim()).map(l => l.match(/^ */)[0].length), 99); return ls.map(l => l.slice(Math.min(ind, l.match(/^ */)[0].length))).join('\n'); }
function parseSource(text) {
  const res = [], re = /\b(FUNCTION_BLOCK|FUNCTION|ORGANIZATION_BLOCK|DATA_BLOCK)\s+("([^"]+)"|([A-Za-z_]\w*))([\s\S]*?)\bEND_\1\b/g; let m;
  const secMap = { VAR_INPUT: 'Input', VAR_OUTPUT: 'Output', VAR_IN_OUT: 'InOut', VAR_TEMP: 'Temp', VAR: 'Static' };
  while ((m = re.exec(text))) {
    const kind = m[1], name = m[3] || m[4]; let rest = m[5];
    const type = { FUNCTION_BLOCK: 'FB', FUNCTION: 'FC', ORGANIZATION_BLOCK: 'OB', DATA_BLOCK: 'DB' }[kind];
    const bi = rest.search(/^\s*BEGIN\b/m); const head = bi >= 0 ? rest.slice(0, bi) : rest; let body = bi >= 0 ? rest.slice(bi).replace(/^\s*BEGIN\b/, '') : '';
    const iface = {}; const vre = /\b(VAR_INPUT|VAR_OUTPUT|VAR_IN_OUT|VAR_TEMP|VAR)\b(?:\s+(?:RETAIN|NON_RETAIN|CONSTANT|DB_SPECIFIC))?([\s\S]*?)\bEND_VAR\b/g; let v;
    while ((v = vre.exec(head))) { const sec = type === 'DB' ? 'Static' : secMap[v[1]]; iface[sec] = iface[sec] || [];
      const dre = /^\s*"?([A-Za-z_]\w*)"?\s*(?:\{[^}]*\})?\s*:\s*([^;]+?)\s*(?::=\s*([^;]+?))?\s*;[ \t]*(?:\/\/(.*))?$/gm; let d;
      while ((d = dre.exec(v[2]))) { if (/^\s*(STRUCT|ARRAY)/i.test(d[2])) continue; iface[sec].push({ name: d[1], type: normType(d[2]), init: (d[3] || '').trim(), comment: (d[4] || '').trim() }); } }
    const b = { name, type, iface };
    if (type === 'DB') { const rem = head.replace(/\{[^}]*\}/g, '').replace(/\b(VAR[\s\S]*?END_VAR)\b/g, '').replace(/^\s*(VERSION|TITLE|AUTHOR|FAMILY|NAME)\s*[:=].*$/gim, '').replace(/\bNON_RETAIN\b|\bRETAIN\b/g, '').trim();
      if (rem) b.instanceOf = normType(rem.split(/\s+/)[0]); delete b.iface; if (!b.instanceOf) b.iface = { Static: iface.Static || [] }; }
    else if (/^\s*NETWORK\b/m.test(body)) { b.lang = 'STL'; b.networks = body.split(/^\s*NETWORK\b.*$/m).slice(1).map(part => {
        const lines = part.split('\n'); let title = '', comment = ''; const code = [];
        for (const l of lines) { const t = l.trim(); const mt = /^TITLE\s*=\s*(.*)$/i.exec(t); if (mt && !code.length) { title = mt[1].trim(); continue; } if (/^(\/\/)/.test(t) && !code.length && !comment) { comment = t.slice(2).trim(); continue; } code.push(l); }
        return { title, comment, awl: dedent(code.join('\n')).split('\n').map(l => l.replace(/;\s*(\/\/.*)?$/, (m, c) => c ? '   ' + c : '')).join('\n') }; }); }

}

/* ---------- Bausteinaufruf (dynamisch) ---------- */
function callDef(box, reg) {
  const bn = String(box.blk || '').replace(/"/g, ''); const b = bn && reg && reg.blocks.get(bn.toLowerCase());
  if (!b || (b.type !== 'FB' && b.type !== 'FC')) return { id: 'CALL', cat: 'user', kind: 'en', name: bn || 'FB/FC ?', title: 'Bausteinaufruf', ins: [], outs: [], missing: bn || '?', body: () => '' };
  const ins = [...ifaceVars(b, ['Input']).map(v => pin(v.name, normType(v.type), b.type === 'FB' ? { opt: 1 } : {})), ...ifaceVars(b, ['InOut']).map(v => pin(v.name, normType(v.type), { inout: 1, val: 1 }))];
  const outs = ifaceVars(b, ['Output']).map(v => pin(v.name, normType(v.type), { opt: 1 }));
  return { id: 'CALL', cat: 'user', kind: 'en', name: b.name, title: (b.type === 'FB' ? 'FB' : 'FC') + ' aufrufen', block: b, fb: b.type === 'FB', ins, outs,
    body: (p, bx) => { const args = []; for (const q of ins) { const raw = (bx.pins || {})[q.n]; const unc = raw == null || raw === '' || (typeof raw === 'object' && !raw.n); if (!unc && p[q.n] !== '') args.push(`${q.n} := ${p[q.n]}`); } for (const q of outs) if (p['>' + q.n]) args.push(`${q.n} => ${p['>' + q.n]}`);
      return `${b.type === 'FB' ? (String(bx.inst || '').trim() || '???') : '"' + b.name + '"'}(${args.join(', ')});`; } };
}
function getDef(box, reg) { return box.i === 'CALL' ? callDef(box, reg) : INS[box.i]; }
function boxPins(d, box) {
  let ins = d.ins.slice(), outs = d.outs.slice();
  const expand = (arr, v) => { const i = arr.findIndex(q => q.n === '*'); if (i < 0) return arr; const n = Math.min(v.max, Math.max(v.min, box.n || v.min)); const t = arr[i].t; const add = []; for (let k = 0; k < n; k++) add.push(pin(v.pre + (v.from + k), t)); return [...arr.slice(0, i), ...add, ...arr.slice(i + 1)]; };
  if (d.varIn) ins = expand(ins, d.varIn); if (d.varOut) outs = expand(outs, d.varOut);
  if (d.kind === 'en') { ins = [pin('EN', 'Bool', { main: 1, en: 1 }), ...ins]; outs = [pin('ENO', 'Bool', { main: 1, opt: 1 }), ...outs]; }
  if (d.kind === 'edge') { ins = []; outs = [pin('Q', 'Bool', { main: 1, hidden: 1 })]; }
  return { ins, outs };
}
function isLogicPin(q) { return q.t === 'Bool' && !q.val && !q.inout; }
function mainIn(d, box) { const { ins } = boxPins(d, box); return ins.find(q => q.main) || null; }
function mainOut(d, box) { const { outs } = boxPins(d, box); return outs.find(q => q.main) || null; }
function pinType(q, box) { return q.t === 'dt' ? (box.dtype || 'Int') : q.t === 'dt2' ? (box.dtype2 || 'Real') : q.t; }
function newBox(id, extra) {
  const d = INS[id] || { kind: 'en', ins: [], outs: [] }; const box = { t: 'BOX', i: id, pins: {}, outs: {} };
  if (d.dt) box.dtype = d.dt.def; if (d.dt2) box.dtype2 = d.dt2.def; if (d.varIn) box.n = d.varIn.min; if (d.varOut) box.n = d.varOut.min;
  if (id === 'CALCULATE') box.expr = 'IN1 + IN2';
  if (d.kind === 'ff' || d.kind === 'edge') box.op = '';
  if (d.kind === 'edge' || d.kind === 'trig') box.mem = '';
  if (d.kind === 'iec') box.inst = '';
  for (const q of boxPins(d, box).ins) if (isLogicPin(q)) box.pins[q.n] = { neg: false, n: q.main || q.opt ? null : { t: 'OP', op: '' } }; else box.pins[q.n] = '';
  if (id === 'TON' || id === 'TOF' || id === 'TP' || id === 'TONR') box.pins.PT = 'T#5s';
  if (id === 'CTU' || id === 'CTD' || id === 'CTUD') box.pins.PV = '10';
  return Object.assign(box, extra || {});
}
const leaf = (op = '') => ({ neg: false, n: { t: 'OP', op } });
function newNet(lang) { return lang === 'STL' ? { title: '', comment: '', awl: '' } : { title: '', comment: '', roots: [] }; }

/* ---------- Baum-Hilfen ---------- */
function rootStart(root) { return root.k === 'BOX' ? null : root.in; }
function getInput(root, path) {
  let cur = root.k === 'BOX' ? { n: root.box } : root.in; let i = 0;
  if (root.k === 'BOX') { if (!path.length) return null; cur = root.box.pins[path[0]]; i = 1; }
  for (; i < path.length; i++) { const s = path[i]; if (!cur || !cur.n) return null; cur = typeof s === 'number' ? (cur.n.ins || [])[s] : (cur.n.pins || {})[s]; }
  return cur || null;
}
function walkNode(n, fn) { if (!n) return; fn(n); if (n.ins) n.ins.forEach(i => walkNode(i.n, fn)); if (n.t === 'BOX') for (const v of Object.values(n.pins || {})) if (v && typeof v === 'object') walkNode(v.n, fn); }
function walkNet(net, fn) { for (const r of net.roots || []) { if (r.k === 'BOX') walkNode(r.box, fn); else walkNode(r.in && r.in.n, fn); } }

/* ---------- SCL-Erzeugung ---------- */
function opReq(v, g, what) { const s = String(v ?? '').trim(); if (!s) { g.err(`${what} fehlt (<???>)`); return 'FALSE'; } return s; }
function genInput(inp, g) {
  if (!inp || !inp.n) return null;
  const x = genNode(inp.n, g); const r = inp.neg ? 'NOT ' + par(x) : x; g.disp.set(inp, r); return r;
}
function genNode(n, g) {
  let r;
  if (n.t === 'OP') r = opReq(n.op, g, 'Operand');
  else if (n.t === 'BOX') r = genBox(n, g, false);
  else { const j = { AND: ' AND ', OR: ' OR ', XOR: ' XOR ' }[n.t]; const parts = (n.ins || []).map(i => { const x = genInput(i, g); if (x === null) { g.err('Gattereingang nicht verschaltet'); return 'FALSE'; } return par(x); });
    r = !parts.length ? (g.err('Box ohne Eingänge'), 'FALSE') : parts.length === 1 ? parts[0] : '(' + parts.join(j) + ')'; }
  g.disp.set(n, r); return r;
}
function genBox(box, g, isRoot) {
  const d = getDef(box, g.reg); if (!d) { g.err('Unbekannte Anweisung ' + box.i); return 'FALSE'; }
  if (d.missing) { g.err(`Baustein „${d.missing}“ existiert nicht oder ist kein FB/FC`); return 'FALSE'; }
  const nm = d.name; const { ins, outs } = boxPins(d, box); const p = {};
  for (const q of ins) {
    if (isLogicPin(q)) { let e = genInput(box.pins[q.n], g);
      if (e === null) { if (q.en) e = 'TRUE'; else if (q.opt) e = 'FALSE'; else { g.err(`${nm}: Eingang ${q.n} nicht verschaltet`); e = 'FALSE'; } }
      p[q.n] = e; }
    else { let v = String(box.pins[q.n] ?? '').trim(); if (!v && !q.opt) { g.err(`${nm}: Operand an ${q.n} fehlt (<???>)`); v = '0'; } p[q.n] = v; }
  }
  for (const q of outs) { const v = String((box.outs || {})[q.n] ?? '').trim(); p['>' + q.n] = v; if (!v && !q.opt && !q.main) g.err(`${nm}: Ausgang ${q.n} nicht verschaltet (<???>)`); if (!v && !q.opt && !q.main) p['>' + q.n] = '#__dummy'; }
  const mo = outs.find(q => q.main);
  switch (d.kind) {
    case 'iec': { const inst = opReq(box.inst, g, `${nm}: Instanz`); const a = [];
      for (const q of ins) if (p[q.n] !== '' && !(q.opt && p[q.n] === 'FALSE' && isLogicPin(q) && !(box.pins[q.n] && box.pins[q.n].n))) a.push(`${q.n} := ${p[q.n]}`);
      for (const q of outs) if (p['>' + q.n]) a.push(`${q.n} => ${p['>' + q.n]}`);
      g.emit(`${inst}(${a.join(', ')});`); return `${inst}.${mo.n}`; }
    case 'en': case 'call': {
      if (d.fb && !String(box.inst || '').trim()) g.err(`${nm}: Instanz fehlt`);
      const body = d.body(p, box, d, g); const en = p.EN; let t = 'TRUE';

  if (!txt || !txt.trim()) { toast('Keine Quelle angegeben', 'warn'); return; }
  let bl; try { bl = parseSource(txt); } catch (e) { toast('Quelle nicht lesbar: ' + e.message, 'err'); return; }
  if (!bl.length) { toast('Keine Bausteine in der Quelle gefunden', 'err'); return; }
  for (const b of bl) { const i = P.blocks.findIndex(x => x.name.toLowerCase() === b.name.toLowerCase());
    if (i >= 0) b.number = P.blocks[i].number; else b.number = b.type === 'OB' ? (/startup/i.test(b.name) ? 100 : nextNum('OB', 1)) : nextNum(b.type);
    if (b.type !== 'DB') for (const s of SECTIONS[b.type]) b.iface[s] = b.iface[s] || [];
    if (i >= 0) P.blocks[i] = b; else P.blocks.push(b); }
  toast(bl.length + ' Baustein(e) importiert', 'ok'); touch({ nav: true }); select('block', bl[0].name);
}
function copyText(t) { try { navigator.clipboard.writeText(t).then(() => toast('In die Zwischenablage kopiert', 'ok'), () => toast('Kopieren nicht erlaubt – Text markieren und manuell kopieren', 'warn')); } catch (e) { toast('Kopieren nicht möglich', 'warn'); } }

/* ===================== Dialoge ===================== */
function modal(html, buttons, cls = '') { const m = $('#modal'); m.innerHTML = `<div class="mbox ${cls}">${html}<div class="mbtn">${buttons.map(([l, fn, c, id]) => `<button class="${c || ''}" ${id ? `id="${id}"` : ''} ${A(fn)}>${l}</button>`).join('')}</div></div>`; m.className = 'on'; const f = m.querySelector('input:not([type=radio]):not([type=checkbox]):not([type=file])'); if (f) setTimeout(() => f.focus(), 30); }
function closeModal() { $('#modal').className = ''; $('#modal').innerHTML = ''; }
function confirmDlg(text, fn) { modal(`<h3>Bestätigen</h3><p>${esc(text)}</p>`, [['Abbrechen', closeModal], ['OK', () => { closeModal(); fn(); }, 'pri']]); }
const LANG_CARDS = [['LAD', 'KOP', 'Kontaktplan', 'Grafisch wie ein Stromlaufplan: Kontakte, Spulen und Boxen.'], ['FBD', 'FUP', 'Funktionsplan', 'Grafisch mit Logikboxen (&, >=1) wie in der Digitaltechnik.'],
  ['SCL', 'SCL', 'Structured Control Language', 'Textuell, angelehnt an Pascal – ideal für Berechnungen und Abläufe.'], ['STL', 'AWL', 'Anweisungsliste', 'Maschinennah mit VKE und Akkus – nur S7-300/400/1500.']];
function langCards(name, cur, cpu) { return `<div class="lcards">${LANG_CARDS.map(([l, s, t, d]) => { const dis = l === 'STL' && isS71200(cpu); return `<label class="lcard ${dis ? 'dis' : ''}"><input type="radio" name="${name}" value="${l}" ${cur === l ? 'checked' : ''} ${dis ? 'disabled' : ''}><span><b>${s}</b><em>${t}</em><small>${dis ? 'Von S7-1200 nicht unterstützt' : d}</small></span></label>`; }).join('')}</div>`; }
function newProjectDlg() {
  modal(`<h3>Neues Projekt erstellen</h3>
    <label class="fl">Projektname<input id="npName" value="${esc(uniqName('Projekt_', []))}"></label>
    <label class="fl">CPU<select id="npCpu">${CPUS.map(c => `<option ${c === 'CPU 1516-3 PN/DP' ? 'selected' : ''}>${c}</option>`).join('')}</select></label>
    <div class="fl">Programmiersprache des Projekts <small>(Pflichtauswahl – neue Bausteine werden in dieser Sprache angelegt)</small></div>
    <div id="npL">${langCards('npLang', null, 'CPU 1516-3 PN/DP')}</div>`,
    [['Abbrechen', closeModal], ['Projekt erstellen', () => { const l = document.querySelector('input[name=npLang]:checked'); if (!l) { toast('Bitte zuerst eine Programmiersprache wählen', 'warn'); return; }
      const name = $('#npName').value.trim() || 'Neues Projekt', cpu = $('#npCpu').value; closeModal(); if (DESK) { filePath = null; rememberPath(); }
      setProject(emptyProject(l.value, name, cpu)); if (DESK) setFileDirty(false); toast(`Projekt „${name}“ in ${LANG_L[l.value]} erstellt`, 'ok'); }, 'pri', 'npOk']], 'wide');
  const upd = () => { const ok = !!document.querySelector('input[name=npLang]:checked'); $('#npOk').disabled = !ok; };
  $('#npCpu').addEventListener('change', () => { const cur = (document.querySelector('input[name=npLang]:checked') || {}).value; $('#npL').innerHTML = langCards('npLang', cur === 'STL' && isS71200($('#npCpu').value) ? null : cur, $('#npCpu').value); hook(); upd(); });
  const hook = () => document.querySelectorAll('input[name=npLang]').forEach(r => r.addEventListener('change', upd)); hook(); upd();
}
function exampleDlg() {
  modal(`<h3>Beispielprojekt „Pumpstation“</h3><p class="hint small">Füllstandsregelung mit Pumpe, Rückmeldeüberwachung, Analogwert-Skalierung und Störmeldungen. Wähle die Sprache, in der das Beispiel angezeigt werden soll. SCL-Bausteine bleiben in SCL.</p>
    <label class="lcard mixed"><input type="radio" name="exLang" value="MIX" checked><span><b>Gemischt</b><em>Original</em><small>KOP, FUP, SCL und AWL nebeneinander – zum Vergleichen.</small></span></label>
    ${langCards('exLang', null, P.cpu)}`, [['Abbrechen', closeModal], ['Laden', () => { const v = document.querySelector('input[name=exLang]:checked').value; closeModal();
      const np = exampleProject(); let rep = null; if (v !== 'MIX') rep = convertProject(np, v); if (DESK) { filePath = null; rememberPath(); }
      setProject(np); if (DESK) setFileDirty(false); if (rep) showReport(rep, v, 'Beispielprojekt geladen'); else toast('Beispielprojekt geladen', 'ok'); }, 'pri']], 'wide');
}
function langDlg() {
  modal(`<h3>Programmiersprache des Projekts</h3><p class="hint small">Aktuell: <b>${LANG_LONG[P.lang]}</b>. Neue Bausteine werden in der Projektsprache angelegt.</p>
    ${langCards('plLang', P.lang, P.cpu)}
    <label class="chk"><input type="checkbox" id="plConv" checked> Vorhandene Bausteine umwandeln</label>
    <p class="hint small">KOP ↔ FUP ist immer möglich, KOP/FUP → AWL und → SCL ebenfalls. AWL → KOP/FUP nur bei darstellbaren Netzwerken. SCL lässt sich nicht automatisch in andere Sprachen umwandeln – solche Bausteine bleiben unverändert.</p>`,
    [['Abbrechen', closeModal], ['Übernehmen', () => { const v = document.querySelector('input[name=plLang]:checked').value; const conv = $('#plConv').checked; closeModal();
      if (conv) { const rep = convertProject(P, v); ui.nsel = null; touch({ nav: true }); showReport(rep, v, 'Projektsprache geändert'); } else { P.lang = v; touch(); toast('Projektsprache: ' + LANG_L[v], 'ok'); } }, 'pri']], 'wide');
}
function showReport(rep, to, title) {
  const ok = rep.filter(r => r.ok && !r.same), same = rep.filter(r => r.same), bad = rep.filter(r => !r.ok);
  modal(`<h3>${esc(title)}</h3><p>Projektsprache: <b>${LANG_LONG[to]}</b></p>
    <table class="rep">${ok.map(r => `<tr><td class="ok">✔</td><td>${esc(r.name)}</td><td>${LANG_L[r.from]} → ${LANG_L[to]}</td></tr>`).join('')}${same.map(r => `<tr><td class="ok">✔</td><td>${esc(r.name)}</td><td>bereits ${LANG_L[to]}</td></tr>`).join('')}${bad.map(r => `<tr><td class="warn">⚠</td><td>${esc(r.name)}</td><td>bleibt ${LANG_L[r.from]} – ${esc(r.msg)}</td></tr>`).join('')}</table>`, [['OK', closeModal, 'pri']], 'wide');
}
function openProjectDlg() {
  if (DESK) return fileOpen();
  modal(`<h3>Projekt öffnen</h3><p class="hint small">Eine gesicherte Projektdatei (.spsw / .json) wählen oder den Projekttext einfügen.</p>
    <input type="file" accept=".spsw,.json" id="jsonfile"><textarea id="jsonin" class="mono imp" placeholder="{ &quot;name&quot;: … }"></textarea>`,
    [['Abbrechen', closeModal], ['Öffnen', async () => { const txt = (await readFileInput('#jsonfile')) || $('#jsonin').value; let np;
      try { np = JSON.parse(txt); if (!Array.isArray(np.tags) || !Array.isArray(np.blocks)) throw new Error('Kein gültiges Projekt'); } catch (e) { toast('Projektdatei ungültig: ' + e.message, 'err'); return; }
      closeModal(); setProject(np); toast('Projekt geöffnet', 'ok'); }, 'pri']]);
}
function exportProjectDlg() {
  const txt = JSON.stringify(P, null, 1);
  modal(`<h3>Projekt sichern</h3><p class="hint small">Das Projekt wird automatisch in diesem Browser gespeichert. Zum Sichern oder Übertragen den Text kopieren und als <b>.spsw</b>-Datei speichern – die Desktop-App öffnet ihn direkt.</p><textarea class="mono imp" readonly>${esc(txt)}</textarea>`,
    [['Schließen', closeModal], ['Kopieren', () => copyText(txt), 'pri']]);
}
function projPropsDlg() {
  modal(`<h3>Projekteigenschaften</h3><label class="fl">Projektname<input id="ppName" value="${esc(P.name)}"></label>
    <label class="fl">CPU<select id="ppCpu">${CPUS.map(c => `<option ${c === P.cpu ? 'selected' : ''}>${c}</option>`).join('')}${CPUS.includes(P.cpu) ? '' : `<option selected>${esc(P.cpu)}</option>`}</select></label>`,
    [['Abbrechen', closeModal], ['OK', () => { const cpu = $('#ppCpu').value; if (isS71200(cpu) && P.blocks.some(b => b.lang === 'STL')) { toast('Das Projekt enthält AWL-Bausteine – S7-1200 unterstützt kein AWL', 'err'); return; }
      P.name = $('#ppName').value.trim() || P.name; P.cpu = cpu; closeModal(); touch({ nav: true }); }, 'pri']]);
}
function addBlockDlg() {
  ui.navOpen = false; renderNav();
  const fbs = P.blocks.filter(b => b.type === 'FB').map(b => b.name);
  modal(`<h3>Neuen Baustein hinzufügen</h3>
   <div class="seg" id="nbType">${[['OB', 'Organisationsbaustein'], ['FB', 'Funktionsbaustein'], ['FC', 'Funktion'], ['DB', 'Datenbaustein']].map(([t, l]) => `<label><input type="radio" name="nbt" value="${t}" ${t === 'FB' ? 'checked' : ''}><span><b>${t}</b>${l}</span></label>`).join('')}</div>
   <label class="fl">Name<input id="nbName" class="mono" value="${uniqName('Baustein_', P.blocks.map(b => b.name))}"></label>
   <label class="fl" id="nbLangL">Sprache<select id="nbLang">${['LAD', 'FBD', 'SCL', 'STL'].map(l => `<option value="${l}" ${l === P.lang ? 'selected' : ''} ${l === 'STL' && isS71200(P.cpu) ? 'disabled' : ''}>${LANG_LONG[l]}</option>`).join('')}</select></label>
   <label class="fl" id="nbInstL">DB-Typ<select id="nbInst"><option value="">Global-DB</option>${[...fbs, ...IEC_NAMES].map(t => `<option value="${esc(t)}">Instanz-DB von ${esc(t)}</option>`).join('')}</select></label>
   <label class="fl">Nummer<input id="nbNum" type="number" min="1" placeholder="automatisch"></label>`, [['Abbrechen', closeModal], ['OK', createBlock, 'pri']]);
  const upd = () => { const t = document.querySelector('input[name=nbt]:checked').value; $('#nbLangL').style.display = t === 'DB' ? 'none' : ''; $('#nbInstL').style.display = t === 'DB' ? '' : 'none'; };
  document.querySelectorAll('input[name=nbt]').forEach(r => r.addEventListener('change', upd)); upd();
}
function createBlock() {
  const t = document.querySelector('input[name=nbt]:checked').value, name = $('#nbName').value.trim(), lang = $('#nbLang').value, inst = $('#nbInst').value; let num = parseInt($('#nbNum').value, 10);
  if (!/^[A-Za-z_][\w]*$/.test(name)) { toast('Name: nur Buchstaben, Ziffern, _ (nicht mit Ziffer beginnen)', 'err'); return; }
  if ([...P.blocks.map(b => b.name), ...P.tags.map(t => t.name)].some(n => n.toLowerCase() === name.toLowerCase())) { toast('Name ist bereits vergeben', 'err'); return; }
  if (!num) num = t === 'OB' ? (P.blocks.some(b => b.type === 'OB' && (b.number | 0) === 1) ? nextNum('OB', 123) : 1) : nextNum(t);
  else if (P.blocks.some(b => b.type === t && (b.number | 0) === num)) { toast(`${t}${num} existiert bereits`, 'err'); return; }
  const b = { name, type: t, number: num };
  if (t === 'DB') { if (inst) b.instanceOf = inst; else b.iface = { Static: [] }; }
  else { b.lang = lang; b.iface = {}; for (const s of SECTIONS[t]) b.iface[s] = [];
    if (lang === 'SCL') b.scl = t === 'OB' ? '// Zyklisches Programm\n' : '// ' + name + '\n'; else b.networks = [newNet(lang)]; }
  P.blocks.push(b); closeModal(); touch({ nav: true }); select('block', name);
}
function propsDlg(b) {
  modal(`<h3>Eigenschaften ${b.type} „${esc(b.name)}“</h3><label class="fl">Name<input id="pName" class="mono" value="${esc(b.name)}"></label><label class="fl">Nummer<input id="pNum" type="number" min="1" value="${b.number ?? ''}"></label>
    ${b.type === 'OB' ? '<p class="hint small">OB1 und OB ≥ 123 laufen zyklisch, OB100 einmal beim Anlauf (STOP → RUN).</p>' : ''}`,
    [['Abbrechen', closeModal], ['OK', () => { const n = $('#pName').value.trim(), num = parseInt($('#pNum').value, 10);
      if (!/^[A-Za-z_][\w]*$/.test(n)) { toast('Ungültiger Name', 'err'); return; }
      if (n.toLowerCase() !== b.name.toLowerCase() && [...P.blocks.map(x => x.name), ...P.tags.map(t => t.name)].some(x => x.toLowerCase() === n.toLowerCase())) { toast('Name ist bereits vergeben', 'err'); return; }
      if (num && P.blocks.some(x => x !== b && x.type === b.type && (x.number | 0) === num)) { toast(`${b.type}${num} existiert bereits`, 'err'); return; }
      const old = b.name; b.name = n; if (num) b.number = num; renameRefs(old, n); closeModal(); ui.sel.name = n; touch({ nav: true }); }, 'pri']]);
}
function delBlockDlg(b) { confirmDlg(`Baustein „${b.name}“ löschen?`, () => { P.blocks.splice(P.blocks.indexOf(b), 1); touch({ nav: true }); select('tags'); }); }
function startDlg() {
  modal(`<div class="welcome"><span class="logo big"></span><h3>Willkommen in der SPS-Werkbank</h3><p class="hint">Programmieren lernen wie im TIA Portal: KOP, FUP, SCL und AWL mit simulierter CPU.</p></div>
    <div class="startbtns"><button class="pri" ${A(() => { closeModal(); newProjectDlg(); })}><b>Neues Projekt erstellen</b><small>Sprache wählen und loslegen</small></button>
    <button ${A(() => { closeModal(); openProjectDlg(); })}><b>Projekt öffnen</b><small>Gesicherte .spsw-Datei laden</small></button>
    <button ${A(() => { closeModal(); exampleDlg(); })}><b>Beispielprojekt</b><small>Pumpstation in der Sprache deiner Wahl</small></button></div>`, [['Später', closeModal]], 'wide');
}

/* ===================== Desktop-Integration (Electron) ===================== */
var DESK = typeof window !== 'undefined' && window.desktop ? window.desktop : null;
var filePath = null, fileDirty = false;
const PROJ_FILTER = [{ name: 'SPS-Werkbank-Projekt', extensions: ['spsw', 'json'] }];
function setFileDirty(d) { fileDirty = d; if (DESK) { DESK.setDirty(d); updateTitle(); } }
function updateTitle() { if (DESK) DESK.setTitle(`${fileDirty ? '● ' : ''}${filePath ? filePath.split(/[\\/]/).pop() : P.name} – SPS-Werkbank`); }
function rememberPath() { try { if (filePath) localStorage.setItem(LS_KEY + '-pfad', filePath); else localStorage.removeItem(LS_KEY + '-pfad'); } catch (e) {} }
function guardDirty(fn) {
  if (!DESK || !fileDirty) return fn();
  modal('<h3>Ungespeicherte Änderungen</h3><p>Möchtest du die Änderungen am Projekt „' + esc(P.name) + '“ speichern?</p>',
    [['Abbrechen', closeModal], ['Nicht speichern', () => { closeModal(); fn(); }, 'danger'], ['Speichern', async () => { closeModal(); if (await fileSave(false)) fn(); }, 'pri']]);
}
async function fileOpen(path) {
  const r = await DESK.openFile({ title: 'Projekt öffnen', filters: PROJ_FILTER, path }); if (!r) return;
  let np; try { np = JSON.parse(r.content); if (!Array.isArray(np.tags) || !Array.isArray(np.blocks)) throw new Error('kein SPS-Werkbank-Projekt'); }
  catch (e) { toast('Datei ungültig: ' + e.message, 'err'); return; }
  setProject(np); filePath = r.path; rememberPath(); setFileDirty(false); toast('Geöffnet: ' + r.path, 'ok');
}
async function fileSave(as) {
  const r = await DESK.saveFile({ title: 'Projekt speichern', content: JSON.stringify(P, null, 1), path: as ? null : filePath, defaultName: (P.name || 'Projekt').replace(/[\\/:*?"<>|]/g, '_') + '.spsw', filters: PROJ_FILTER });
  if (!r) return false; filePath = r.path; rememberPath(); setFileDirty(false); toast('Gespeichert: ' + r.path, 'ok'); return true;
}
async function exportSrcFile(kind = 'scl') {
  let src; try { src = genSource(P, kind); } catch (e) { toast('Quelle konnte nicht erzeugt werden: ' + e.message, 'err'); return; }
  const r = await DESK.saveFile({ title: 'Externe Quelle exportieren', content: src, defaultName: (P.name || 'Projekt').replace(/[\\/:*?"<>|]/g, '_') + '.' + kind, filters: [{ name: kind === 'awl' ? 'AWL-Quelle' : 'SCL-Quelle', extensions: [kind] }] });
  if (r) toast('Quelle gespeichert: ' + r.path, 'ok');
}
async function importSrcFileDesk() { const r = await DESK.openFile({ title: 'Externe Quelle importieren', filters: [{ name: 'Externe Quelle', extensions: ['scl', 'awl', 'txt'] }] }); if (r) importSrcText(r.content); }
async function aboutDlg() { const i = DESK ? await DESK.appInfo() : {}; modal(`<h3>SPS-Werkbank</h3><p>${i.version ? 'Version ' + esc(i.version) + ' · ' + esc(i.platform) : 'Web-Version'}</p><p class="hint small">Programmierumgebung für KOP, FUP, SCL und AWL mit simulierter CPU, Anweisungsbibliothek nach dem Vorbild der TIA-Basisanweisungen und Austausch über externe Quellen. Kein Produkt der Siemens AG; „TIA Portal“ und „SIMATIC“ sind Marken der Siemens AG.</p>`, [['OK', closeModal, 'pri']]); }
if (DESK) {
  document.body.classList.add('desktop');
  try { filePath = localStorage.getItem(LS_KEY + '-pfad'); } catch (e) {}
  DESK.onMenu(cmd => {
    const go = { new: () => guardDirty(newProjectDlg), open: () => guardDirty(() => fileOpen()), save: () => fileSave(false), saveAs: () => fileSave(true),
      exportScl: () => exportSrcFile('scl'), exportAwl: () => exportSrcFile('awl'), importScl: importSrcFileDesk, compile: () => doCompile(), load: doLoad, run: doRun, stop: doStop,
      example: () => guardDirty(exampleDlg), lang: langDlg, tags: () => select('tags'), watch: () => select('watch'), diag: () => select('diag'), src: () => select('src'), about: aboutDlg }[cmd];
    if (go) go();
  });
  DESK.onOpenPath(p => guardDirty(() => fileOpen(p)));
  DESK.onAskClose(() => guardDirty(() => DESK.closeNow()));
  setFileDirty(false);
}

/* ===================== Start ===================== */
document.getElementById('scrim').addEventListener('click', () => { ui.navOpen = false; ui.libOpen = false; renderNav(); renderLib(); });
if (!P.blocks.some(b => b.name === ui.sel.name)) ui.sel = { k: 'block', name: (P.blocks.find(b => b.type === 'OB') || P.blocks[0] || {}).name };
renderEditor();
if (firstStart) setTimeout(startDlg, 200);

</script>
